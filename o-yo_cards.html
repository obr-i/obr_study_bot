<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>О/Ё после шипящих – карточки</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
    <div class="container">
        <h1></h1>
        <div class="subtitle" id="subtitle">Выбери тему</div>

        <div id="theme-selector">
            <h2>Какая группа?</h2>
            <div class="theme-buttons"></div>
            <div id="message" class="message"></div>
        </div>

        <div class="card-wrapper" id="cardWrapper">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <span class="pattern" id="patternDisplay"></span>
                    <span class="note-front" id="noteFrontDisplay"></span>
                    <span class="hint">👆 коснись, чтобы увидеть ответ</span>
                </div>
                <div class="card-face card-back">
                    <span class="answer" id="answerDisplay"></span>
                    <span class="note-back" id="noteBackDisplay"></span>
                    <span class="explanation" id="explanationDisplay"></span>
                </div>
            </div>
        </div>

        <div class="nav" id="nav">
            <button id="prevBtn">◀</button>
            <span class="counter" id="counter">1 / 0</span>
            <button id="nextBtn">▶</button>
        </div>

        <button class="action-btn" id="shuffleBtn">🔀 Перемешать</button>
        <button class="action-btn" id="backBtn">← Выбрать тему</button>
    </div>

    <script src="common.js"></script>
    <script>
        // ---- ЗАГРУЗКА ДАННЫХ ----
        const dataFiles = {
            oyo_words: 'data/oyo_words.txt',
            oyo_patterns: 'data/oyo_patterns.txt',
            oyo_su_words: 'data/oyo_su_words.txt',
            oyo_su_patterns: 'data/oyo_su_patterns.txt'
        };

        loadData(dataFiles).then(rawData => {
            // Парсим пары
            const oyoPairs = parsePairs(rawData.oyo_words, rawData.oyo_patterns);
            const oyosuPairs = parsePairs(rawData.oyo_su_words, rawData.oyo_su_patterns);

            // Формируем конфиг тем
            const themeData = {
                all: { name: 'Все темы', icon: '📚', pairs: [...oyoPairs, ...oyosuPairs] },
                oyo: { name: 'В корне', icon: '📕', pairs: oyoPairs },
                oyosu: { name: 'В суффиксе', icon: '📗', pairs: oyosuPairs },
            };

            // Запускаем приложение
            initApp({
                title: '📚 О/Ё после шипящих',
                themeData: themeData,
                defaultTheme: 'null'
            });
        }).catch(err => {
            console.error('Ошибка загрузки данных:', err);
            document.getElementById('message').textContent = '❌ Ошибка загрузки данных. Проверьте файлы.';
            document.getElementById('message').style.display = 'block';
        });
    </script>
</body>

</html>
