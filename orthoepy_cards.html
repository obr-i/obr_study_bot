<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Орфоэпия ЕГЭ – карточки ударений</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
    <div class="container">
        <h1></h1>
        <div class="subtitle">
            Коснись карточки<span class="hide-on-mobile"> или нажми пробел</span>
        </div>

        <div class="card-wrapper" id="cardWrapper">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <span class="pattern" id="patternDisplay"></span>
                    <span class="note-front" id="noteFrontDisplay"></span>
                    <span class="hint">👆 коснись, чтобы увидеть ответ</span>
                </div>
                <div class="card-face card-back">
                    <span class="answer" id="answerDisplay"></span>
                    <span class="note-back" id="noteBackDisplay"></span>
                </div>
            </div>
        </div>

        <div class="nav">
            <button id="prevBtn" aria-label="Предыдущая">◀</button>
            <span class="counter" id="counter">1 / 0</span>
            <button id="nextBtn" aria-label="Следующая">▶</button>
        </div>

        <button class="action-btn" id="shuffleBtn">🔀 Перемешать</button>
    </div>

    <script src="common.js"></script>
    <script>
        const dataFiles = {
            words: 'data/orthoepy_words.txt',
            patterns: 'data/orthoepy_patterns.txt'
        };

        loadData(dataFiles).then(rawData => {
            const pairs = parsePairs(rawData.words, rawData.patterns);
            const themeData = {
                main: { name: 'Орфоэпия', icon: '📚', pairs: pairs }
            };
            initApp({
                title: '📚 Орфоэпия',
                themeData: themeData,
                defaultTheme: 'main'
            });
        });
    </script>
</body>

</html>
