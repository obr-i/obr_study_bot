<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>№9 ЕГЭ - Русский язык – карточки</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
    <div class="container">
        <h1></h1>
        <div class="subtitle" id="subtitle">Выбери тему</div>

        <div id="theme-selector">
            <h2>Какая группа?</h2>
            <div class="theme-buttons"></div>
            <div id="message" class="message"></div>
        </div>

        <div class="card-wrapper" id="cardWrapper">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <span class="pattern" id="patternDisplay"></span>
                    <span class="note-front" id="noteFrontDisplay"></span>
                    <span class="hint">👆 коснись, чтобы увидеть ответ</span>
                </div>
                <div class="card-face card-back">
                    <span class="answer" id="answerDisplay"></span>
                    <span class="note-back" id="noteBackDisplay"></span>
                    <span class="explanation" id="explanationDisplay"></span>
                </div>
            </div>
        </div>

        <div class="nav" id="nav">
            <button id="prevBtn">◀</button>
            <span class="counter" id="counter">1 / 0</span>
            <button id="nextBtn">▶</button>
        </div>

        <button class="action-btn" id="shuffleBtn">🔀 Перемешать</button>
        <button class="action-btn" id="backBtn">← Выбрать тему</button>
    </div>

    <script src="common.js"></script>
    <script>
        // ---- ЗАГРУЗКА ДАННЫХ ----
        const dataFiles = {
            prov_words: 'data/prov_words.txt',
            prov_patterns: 'data/prov_patterns.txt',
            neprov_words: 'data/neprov_words.txt',
            neprov_patterns: 'data/neprov_patterns.txt',
            chered_words: 'data/chered_words.txt',
            chered_patterns: 'data/chered_patterns.txt',
            oyo_words: 'data/oyo_words.txt',
            oyo_patterns: 'data/oyo_patterns.txt',
            its_words: 'data/its_words.txt',
            its_patterns: 'data/its_patterns.txt'
        };

        loadData(dataFiles).then(rawData => {
            // Парсим пары
            const provPairs = parsePairs(rawData.prov_words, rawData.prov_patterns);
            const neprovPairs = parsePairs(rawData.neprov_words, rawData.neprov_patterns);
            const cheredPairs = parsePairs(rawData.chered_words, rawData.chered_patterns);
            const oyoPairs = parsePairs(rawData.oyo_words, rawData.oyo_patterns);
            const itsPairs = parsePairs(rawData.its_words, rawData.its_patterns);

            // Формируем конфиг тем
            const themeData = {
                all: { name: 'Все темы', icon: '📚', pairs: [...provPairs, ...neprovPairs, ...cheredPairs, ...oyoPairs, ...itsPairs] },
                prov: { name: 'Проверяемые гласные', icon: '📘', pairs: provPairs },
                neprov: { name: 'Непроверяемые гласные', icon: '📗', pairs: neprovPairs },
                chered: { name: 'Чередующиеся корни', icon: '📙', pairs: cheredPairs },
                oyo: { name: 'О/Ё после шипящих', icon: '📕', pairs: oyoPairs },
                its: { name: 'И/Ы после Ц', icon: '📒', pairs: itsPairs },
            };

            // Запускаем приложение
            initApp({
                title: '№9 ЕГЭ - Русский язык',
                themeData: themeData,
                defaultTheme: 'null'   // или 'prov' и т.д.
            });
        }).catch(err => {
            console.error('Ошибка загрузки данных:', err);
            document.getElementById('message').textContent = '❌ Ошибка загрузки данных. Проверьте файлы.';
            document.getElementById('message').style.display = 'block';
        });
    </script>
</body>

</html>
